<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just Cents · wallet lab</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
  textarea { width: 100%; height: 70px; font: 12px monospace; }
  pre { background: #f4f4f4; padding: 10px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  button { font-size: 15px; padding: 6px 14px; margin: 4px 4px 4px 0; }
</style>
</head>
<body>
<h1>Wallet lab (not for judges)</h1>
<p>Network: <select id="net"><option>chipnet</option><option>mainnet</option></select> · Note format: <select id="fmt"><option value="ascii">one ASCII push</option></select></p>
<button id="open">1. Pair a wallet</button>
<textarea id="uri" readonly></textarea>
<div id="qr"></div>
<p>State: <b id="state">idle</b></p>
<button id="pay" disabled>2. Build and sign a test payment</button>
<label><input type="checkbox" id="send"> broadcast after signing</label>
<pre id="log"></pre>
<script type="module" src="/src/lab.ts"></script>
</body>
</html>
